name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (EAS Cloud)
        run: |
          npx eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait 2>&1

      - name: Get build URL
        id: build_info
        run: |
          LATEST_BUILD=$(npx eas build:list --platform android --status finished --limit 1 --non-interactive --json)
          ARTIFACT_URL=$(echo "$LATEST_BUILD" | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0].get('artifacts',{}).get('buildUrl',''))")
          echo "url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: |
          curl -L "${{ steps.build_info.outputs.url }}" -o kalshi-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-tracker-apk
          path: ./kalshi-tracker.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./kalshi-tracker.apk
          generate_release_notes: true
